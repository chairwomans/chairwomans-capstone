<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ewha Capstone Design 2026</title>

  <!-- GitHub 스타일 -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">

  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9fafb;
    }
  </style>
</head>

<body class="markdown-body">
  <div id="content">Loading...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>

  <script>
    const mdPath = encodeURI('project briefs.md')

    fetch(mdPath)
      .then(res => {
        if (!res.ok) throw new Error('파일 못 찾음')
        return res.text()
      })
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md)
      })
      .catch(() => {
        document.getElementById('content').innerHTML =
          '<p style="color:red;">project briefs.md 불러오기 실패</p>'
      })
  </script>
</body>
</html>
